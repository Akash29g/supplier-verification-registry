AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Supplier Verification Registry — DynamoDB + Cognito

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        SUPPLIERS_TABLE: !Ref SuppliersTable
        VERIFICATION_LOG_TABLE: !Ref VerificationLogTable
        USERS_TABLE: !Ref UsersTable

Resources:
  SuppliersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Suppliers"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_user_id
          AttributeType: S
        - AttributeName: gstin
          AttributeType: S
      KeySchema:
        - AttributeName: owner_user_id
          KeyType: HASH
        - AttributeName: gstin
          KeyType: RANGE

  VerificationLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-VerificationLog"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_user_id
          AttributeType: S
        - AttributeName: log_id
          AttributeType: S
      KeySchema:
        - AttributeName: owner_user_id
          KeyType: HASH
        - AttributeName: log_id
          KeyType: RANGE

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
  
  AuthSignupFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: lambda/
    Handler: auth_signup.handler
    Environment:
      Variables:
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
    Policies:
      - Statement:
          - Effect: Allow
            Action:
              - cognito-idp:SignUp
            Resource: !GetAtt UserPool.Arn
    Events:
      Api:
        Type: Api
        Properties:
          Path: /auth/signup
          Method: post

AuthConfirmFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: lambda/
    Handler: auth_confirm.handler
    Environment:
      Variables:
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
    Policies:
      - Statement:
          - Effect: Allow
            Action:
              - cognito-idp:ConfirmSignUp
            Resource: !GetAtt UserPool.Arn
    Events:
      Api:
        Type: Api
        Properties:
          Path: /auth/confirm
          Method: post

AuthLoginFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: lambda/
    Handler: auth_login.handler
    Environment:
      Variables:
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
    Policies:
      - Statement:
          - Effect: Allow
            Action:
              - cognito-idp:InitiateAuth
            Resource: !GetAtt UserPool.Arn
    Events:
      Api:
        Type: Api
        Properties:
          Path: /auth/login
          Method: post

Outputs:
  SuppliersTableName:
    Value: !Ref SuppliersTable
  VerificationLogTableName:
    Value: !Ref VerificationLogTable
  UsersTableName:
    Value: !Ref UsersTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ApiUrl:
    Description: Base URL for the API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"