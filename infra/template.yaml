AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Supplier Verification Registry — DynamoDB + Cognito

Parameters:
  GstincheckApiKey:
    Type: String
    NoEcho: true
  DataGovInApiKey:
    Type: String
    NoEcho: true
    Default: ""
  BedrockRoleArn:
    Type: String

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        SUPPLIERS_TABLE: !Ref SuppliersTable
        VERIFICATION_LOG_TABLE: !Ref VerificationLogTable
        USERS_TABLE: !Ref UsersTable
        STATS_TABLE: !Ref StatsTable
        BADGES_TABLE: !Ref BadgesTable
        GSTINCHECK_API_KEY: !Ref GstincheckApiKey
        DATA_GOV_IN_API_KEY: !Ref DataGovInApiKey
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Resources:
  SuppliersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Suppliers"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_user_id
          AttributeType: S
        - AttributeName: gstin
          AttributeType: S
      KeySchema:
        - AttributeName: owner_user_id
          KeyType: HASH
        - AttributeName: gstin
          KeyType: RANGE

  VerificationLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-VerificationLog"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_user_id
          AttributeType: S
        - AttributeName: log_id
          AttributeType: S
      KeySchema:
        - AttributeName: owner_user_id
          KeyType: HASH
        - AttributeName: log_id
          KeyType: RANGE

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  StatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Stats"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stat_id
          AttributeType: S
      KeySchema:
        - AttributeName: stat_id
          KeyType: HASH

  BadgesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Badges"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: badge_id
          AttributeType: S
      KeySchema:
        - AttributeName: badge_id
          KeyType: HASH

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  AuthSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/
      Handler: auth_signup.handler
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/signup
            Method: post

  AuthConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/
      Handler: auth_confirm.handler
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ConfirmSignUp
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/confirm
            Method: post

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/
      Handler: auth_login.handler
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post

  VerifySupplierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.verify_supplier.handler
      Timeout: 25
      Environment:
        Variables:
          BEDROCK_ROLE_ARN: !Ref BedrockRoleArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: !GetAtt UserPool.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref SuppliersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationLogTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StatsTable
        - Statement:
          - Effect: Allow
            Action: [bedrock:InvokeModel]
            Resource:
              - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-lite-v1:0"
              - "arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0"
        - Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !Ref BedrockRoleArn
            
      Events:
        Api:
          Type: Api
          Properties:
            Path: /suppliers/verify
            Method: post

  GetSuppliersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.get_suppliers.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: !GetAtt UserPool.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref SuppliersTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /suppliers
            Method: get

  GetHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.get_history.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: !GetAtt UserPool.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref VerificationLogTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /history
            Method: get

  GetReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.get_report.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: !GetAtt UserPool.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref VerificationLogTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /reports/{log_id}
            Method: get

  GetStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.get_stats.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref StatsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stats
            Method: get

  DemoSeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.demo_seed.handler
      Timeout: 20
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: !GetAtt UserPool.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref SuppliersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationLogTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /demo/seed
            Method: post

  GetFraudNetworkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.get_fraud_network.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:GetUser]
              Resource: !GetAtt UserPool.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref SuppliersTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /fraud-network
            Method: get

  CreateBadgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.create_badge.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:GetUser]
              Resource: !GetAtt UserPool.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref SuppliersTable
        - DynamoDBReadPolicy:
            TableName: !Ref VerificationLogTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BadgesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /badges
            Method: post

  GetBadgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.get_badge.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BadgesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /badges/{badge_id}
            Method: get

  RecheckAllFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda.recheck_all.handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SuppliersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationLogTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StatsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BadgesTable
      Events:
        NightlyRecheck:
          Type: Schedule
          Properties:
            Schedule: cron(30 20 * * ? *)
            Description: Nightly re-verification of live suppliers (02:00 IST)

Outputs:
  SuppliersTableName:
    Value: !Ref SuppliersTable
  VerificationLogTableName:
    Value: !Ref VerificationLogTable
  UsersTableName:
    Value: !Ref UsersTable
  StatsTableName:
    Value: !Ref StatsTable
  BadgesTableName:
    Value: !Ref BadgesTable
  RecheckAllFunctionName:
    Value: !Ref RecheckAllFunction
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ApiUrl:
    Description: Base URL for the API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
